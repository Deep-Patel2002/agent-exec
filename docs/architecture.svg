<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Agent Exec system architecture</title>
  <desc id="desc">Authenticated CLI submits bounded requests to a Go API. The service validates and persists jobs, schedules a bounded queue, then atomically launches workloads into cgroup v2. Bubblewrap namespaces, a read-only runtime image, private temporary filesystems, and default-deny seccomp isolate untrusted workloads. Bounded output and status are persisted and returned to the authorized client. A hash-chained audit log records state changes.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#059669"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 32px system-ui,sans-serif;fill:#0f172a}.sub{font:15px system-ui,sans-serif;fill:#475569}.box{rx:14;stroke-width:2}.label{font:700 18px system-ui,sans-serif;fill:#0f172a}.body{font:14px system-ui,sans-serif;fill:#334155}.small{font:13px system-ui,sans-serif;fill:#475569}.edge{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#arrow)}.secure{fill:none;stroke:#059669;stroke-width:2.5;marker-end:url(#greenArrow)}.dash{fill:none;stroke:#8b5cf6;stroke-width:2;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900" rx="24"/>
  <text class="title" x="54" y="62">Agent Exec · system architecture</text>
  <text class="sub" x="54" y="91">Trusted control plane admits, contains, records, and returns untrusted agent-generated work.</text>

  <rect class="box" x="55" y="145" width="230" height="138" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="label" x="78" y="180">Client</text><text class="body" x="78" y="210">agent-exec CLI</text><text class="body" x="78" y="235">Bearer token · bounded JSON</text><text class="small" x="78" y="261">submit · wait · get · cancel · list</text>

  <rect class="box" x="355" y="132" width="300" height="164" fill="#eef2ff" stroke="#818cf8"/>
  <text class="label" x="379" y="168">Go API · loopback</text><text class="body" x="379" y="199">Authenticate and authorize</text><text class="body" x="379" y="224">Strict validation · size limits</text><text class="body" x="379" y="249">Bounded admission · request IDs</text><text class="small" x="379" y="274">Origin checks · readiness · metrics</text>

  <rect class="box" x="720" y="137" width="250" height="151" fill="#f5f3ff" stroke="#a78bfa"/>
  <text class="label" x="745" y="174">Service manager</text><text class="body" x="745" y="205">Bounded queue + workers</text><text class="body" x="745" y="230">Deadlines · cancellation</text><text class="body" x="745" y="255">Recovery without replay</text>

  <rect class="box" x="1050" y="126" width="330" height="176" fill="#f0fdf4" stroke="#34d399"/>
  <text class="label" x="1076" y="163">Durable state</text><text class="body" x="1076" y="194">Private atomic job records</text><text class="body" x="1076" y="219">Persist before acknowledging</text><text class="body" x="1076" y="244">Bounded output retention</text><text class="small" x="1076" y="272">Audit sequence + SHA-256 links</text>

  <path class="edge" d="M285 214H350"/><path class="edge" d="M655 214H715"/><path class="edge" d="M970 214H1045"/>
  <text class="small" x="296" y="200">authenticated request</text><text class="small" x="662" y="200">admit</text><text class="small" x="975" y="200">persist</text>

  <rect x="340" y="368" width="1040" height="440" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <text class="label" x="372" y="407">Linux execution boundary · dedicated unprivileged service</text>
  <text class="small" x="372" y="434">Shared kernel; intended for a dedicated host/VM, not public multi-tenant isolation.</text>

  <rect class="box" x="380" y="486" width="224" height="119" fill="#ecfeff" stroke="#22d3ee"/>
  <text class="label" x="402" y="521">Atomic launch</text><text class="body" x="402" y="551">CLONE_INTO_CGROUP</text><text class="small" x="402" y="578">limits applied before exec</text>

  <rect class="box" x="660" y="468" width="300" height="156" fill="#ecfdf5" stroke="#34d399"/>
  <text class="label" x="684" y="505">Bubblewrap namespaces</text><text class="body" x="684" y="536">user · mount · PID · network</text><text class="body" x="684" y="561">IPC · UTS · cgroup</text><text class="small" x="684" y="593">no caps · clean env · no host secrets</text>

  <rect class="box" x="1018" y="468" width="310" height="156" fill="#fefce8" stroke="#facc15"/>
  <text class="label" x="1042" y="505">Default-deny seccomp</text><text class="body" x="1042" y="536">Only explicit syscall allowlist</text><text class="body" x="1042" y="561">Network + escape surfaces denied</text><text class="small" x="1042" y="593">native architecture · no fallback</text>
  <path class="secure" d="M604 546H655"/><path class="secure" d="M960 546H1013"/>

  <rect class="box" x="408" y="681" width="254" height="88" fill="#fff7ed" stroke="#fb923c"/>
  <text class="label" x="431" y="716">cgroup v2</text><text class="small" x="431" y="744">CPU · memory/swap · pids · kill</text>
  <rect class="box" x="723" y="681" width="254" height="88" fill="#f1f5f9" stroke="#94a3b8"/>
  <text class="label" x="746" y="716">Trusted runtime</text><text class="small" x="746" y="744">read-only image + job inputs</text>
  <rect class="box" x="1038" y="681" width="254" height="88" fill="#fff7ed" stroke="#fb923c"/>
  <text class="label" x="1061" y="716">Untrusted job</text><text class="small" x="1061" y="744">private /work + /tmp · no network</text>
  <path class="dash" d="M493 605V676"/><path class="dash" d="M811 624V676"/><path class="edge" d="M1170 624V676"/>

  <path class="secure" d="M1050 302C1015 338 968 343 950 366"/>
  <text class="small" x="1000" y="339">persist state + ordered audit</text>
  <path class="edge" d="M810 288V357"/><text class="small" x="821" y="331">dispatch</text>

  <rect class="box" x="55" y="490" width="230" height="156" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="label" x="78" y="526">Result path</text><text class="body" x="78" y="557">Capture bounded output</text><text class="body" x="78" y="582">Persist terminal state</text><text class="small" x="78" y="613">authorized get / wait response</text>
  <path class="secure" d="M1038 725C820 850 415 814 285 620"/>
  <text class="small" x="432" y="833">bounded result + exit/resource status → durable record → authorized client</text>

  <text class="small" x="55" y="870">Built with Go · seccomp BPF · Bubblewrap · systemd · cgroup v2</text>
</svg>
