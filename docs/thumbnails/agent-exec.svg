<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Agent Exec — Linux workload isolation</title>
  <desc id="desc">Engineering system diagram showing an untrusted job submitted through an authenticated Go API and bounded scheduler into a Linux execution boundary with cgroup v2, Bubblewrap namespaces, and default-deny seccomp. Bounded results are persisted with audit events.</desc>
  <defs>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}.ink{fill:#172b4d}.muted{fill:#52637a}.mono{font-family:Consolas,Menlo,monospace}.outline{stroke:#cad5e2;stroke-width:1.5}.flow{stroke:#52637a;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#52637a" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#f4f7fb"/>
  <rect x="0" y="0" width="1200" height="10" fill="#1677c8"/>
  <text x="56" y="65" class="ink" font-size="18" font-weight="700" letter-spacing="2.5">SYSTEMS SECURITY · PROJECT OVERVIEW</text>
  <text x="54" y="132" class="ink" font-size="54" font-weight="750">Agent Exec</text>
  <text x="58" y="169" class="muted" font-size="21">A bounded execution service for agent-generated workloads</text>
  <text x="58" y="219" class="muted" font-size="13" font-weight="700" letter-spacing="1.5">CONTROL PLANE</text>
  <line x1="58" y1="231" x2="685" y2="231" stroke="#cbd5e1" stroke-width="1"/>

  <rect x="58" y="257" width="146" height="127" rx="10" fill="#ffffff" class="outline"/>
  <text x="78" y="291" class="muted" font-size="12" font-weight="700" letter-spacing="1">INPUT</text>
  <text x="78" y="324" class="ink" font-size="20" font-weight="700">Job request</text>
  <text x="78" y="351" class="muted" font-size="14">argv · UTF-8 files</text>
  <text x="78" y="372" class="muted" font-size="13">Untrusted payload</text>

  <path d="M207 320H232" class="flow"/>
  <rect x="240" y="257" width="190" height="127" rx="10" fill="#ffffff" class="outline"/>
  <text x="260" y="291" class="muted" font-size="12" font-weight="700" letter-spacing="1">GO API</text>
  <text x="260" y="324" class="ink" font-size="20" font-weight="700">Authenticate</text>
  <text x="260" y="351" class="muted" font-size="14">Validate · bound</text>
  <text x="260" y="372" class="muted" font-size="13">Persist before ack</text>

  <path d="M433 320H458" class="flow"/>
  <rect x="466" y="257" width="190" height="127" rx="10" fill="#ffffff" class="outline"/>
  <text x="486" y="291" class="muted" font-size="12" font-weight="700" letter-spacing="1">SERVICE</text>
  <text x="486" y="324" class="ink" font-size="20" font-weight="700">Schedule</text>
  <text x="486" y="351" class="muted" font-size="14">Bounded queue</text>
  <text x="486" y="372" class="muted" font-size="13">Worker · lifecycle</text>

  <path d="M659 320H682" class="flow"/>
  <text x="712" y="219" fill="#13795b" font-size="13" font-weight="700" letter-spacing="1.5">LINUX ENFORCEMENT BOUNDARY</text>
  <rect x="704" y="239" width="438" height="184" rx="14" fill="#edf8f4" stroke="#76b9a2" stroke-width="1.5"/>
  <text x="728" y="273" fill="#145b49" font-size="12" font-weight="700" letter-spacing="1">UNTRUSTED JOB · SHARED KERNEL</text>
  <rect x="728" y="294" width="185" height="73" rx="8" fill="#ffffff" stroke="#b6d7ca"/>
  <text x="746" y="322" class="ink" font-size="17" font-weight="700">Bubblewrap</text>
  <text x="746" y="347" class="muted" font-size="13">namespaces · read-only root</text>
  <rect x="928" y="294" width="190" height="73" rx="8" fill="#ffffff" stroke="#b6d7ca"/>
  <text x="946" y="322" class="ink" font-size="15" font-weight="700">Default-deny seccomp</text>
  <text x="946" y="347" class="muted" font-size="13">network + unlisted calls denied</text>
  <rect x="728" y="380" width="390" height="26" rx="6" fill="#dff0e9"/>
  <text x="746" y="398" fill="#145b49" font-size="13" font-weight="600">cgroup v2 · atomic placement · CPU / memory / pids / kill</text>

  <rect x="58" y="455" width="1084" height="94" rx="10" fill="#eaf0f8"/>
  <text x="82" y="486" class="muted" font-size="12" font-weight="700" letter-spacing="1">DURABLE RESULT + AUDIT</text>
  <text x="82" y="519" class="ink" font-size="18" font-weight="600">Bounded output</text>
  <text x="290" y="519" class="muted" font-size="18">→</text>
  <text x="327" y="519" class="ink" font-size="18" font-weight="600">Persisted terminal state</text>
  <text x="585" y="519" class="muted" font-size="18">→</text>
  <text x="623" y="519" class="ink" font-size="18" font-weight="600">Authorized client response</text>
  <text x="895" y="519" class="muted" font-size="14">Hash-linked audit events</text>

  <text x="58" y="590" class="muted" font-size="13">Dedicated Linux host/VM scope · not microVM isolation or a public multi-tenant service</text>
  <text x="1140" y="590" class="muted" font-size="12" text-anchor="end">GO · LINUX · CGROUP V2</text>
</svg>
